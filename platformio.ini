; Pico Scope Display UI — firmware build entry
;
; NOTE (tools): PlatformIO's official Raspberry Pi platform does not ship the
; native Pico SDK framework yet. This project follows docs/PLATFORMIO_SETUP.md
; and targets the community fork (maxgerhardt/platform-raspberrypi) with
; framework = picosdk. This combination is the documented selection but has
; NOT been built-verified in this repo yet ("尚待驗收" in docs).
;
; After the first successful `pio run -e pico`:
;   1. Record the resolved platform commit / Pico SDK snapshot commit
;      (`pio pkg list`).
;   2. Pin the platform URL below to that verified commit instead of the
;      moving default branch.
;
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = picosdk

; Native Pico SDK headers are used directly (hardware_adc, hardware_dma,
; hardware_spi, pico/time). Do not mix Arduino framework libraries here.
build_flags =
    -DSYSCLOCK=125000000
    ; USB CDC measurement channel (TinyUSB). Set to 0 to build the firmware
    ; without the USB link while toolchain integration is being validated
    ; (stage-0 minimal build acceptance in docs/IMPLEMENTATION_GUIDE.md).
    -DSCOPE_ENABLE_USB_CDC=1
monitor_speed = 115200
