<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Web UI for the RP2040 single-shot oscilloscope: Web Serial or a built-in demo simulator.">
  <title>Pico Scope Display UI</title>
  <!-- GitHub Pages friendly: all paths relative (supports /repo/ subpaths) -->
  <link rel="stylesheet" href="css/scope.css">
</head>
<body>
  <header class="topbar">
    <h1>SCOPE <span class="badge ch1">CH1</span></h1>
    <div class="actions">
      <button id="btn-demo" type="button" class="primary"
              title="Run the built-in simulator — no hardware needed">
        Demo</button>
      <button id="btn-connect" type="button"
              title="Connect to a Pico over Web Serial (Chrome, HTTPS)">
        Connect</button>
      <button id="btn-run" type="button" disabled
              title="Start capturing">Run</button>
      <button id="btn-stop" type="button" disabled
              title="Stop capturing">Stop</button>
      <button id="btn-disconnect" type="button" disabled
              title="Close the connection">Disconnect</button>
    </div>
    <div id="status" class="status" aria-live="polite">not connected</div>
  </header>

  <main>
    <canvas id="scope-canvas" width="240" height="320" role="img"
            aria-label="Oscilloscope waveform display, portrait 240 by 320">
      Waveform display. Press Demo to see a simulated signal.
    </canvas>
    <section class="readouts" aria-label="Measurements">
      <div class="tile"><span class="tile-label">FREQ</span>
        <span id="m-freq" class="tile-value">—</span></div>
      <div class="tile"><span class="tile-label">VPP</span>
        <span id="m-vpp" class="tile-value">—</span></div>
      <div class="tile"><span class="tile-label">RMS</span>
        <span id="m-rms" class="tile-value">—</span></div>
      <div class="tile"><span class="tile-label">RATE</span>
        <span id="m-rate" class="tile-value">—</span></div>
    </section>
    <p id="sr-measurements" class="visually-hidden" aria-live="polite"></p>
    <p class="note">
      <b>Demo</b> runs the deterministic simulator — identical binary frames,
      no device needed. <b>Connect</b> uses Web Serial (Chromium browser over
      HTTPS or localhost) to talk to a Pico.
    </p>
  </main>

  <!--
    Plain (non-module) scripts for maximum hosting compatibility.
    Load order matters: protocol -> serial -> plot -> app.
  -->
  <script src="js/protocol.js"></script>
  <script src="js/serial.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
